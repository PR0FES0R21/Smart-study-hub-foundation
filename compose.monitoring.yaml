services:
  api:
    environment:
      STUDYHUB_METRICS_TOKEN: ${STUDYHUB_METRICS_TOKEN:?Generate a random metrics token and save it privately}
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d", "--storage.tsdb.retention.size=1GB"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${STUDYHUB_METRICS_TOKEN_PATH:-./.secrets/metrics_token}:/run/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["monitoring"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ${STUDYHUB_ALERTMANAGER_CONFIG:-./ops/monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

volumes:
  prometheus-data:
  alertmanager-data:
