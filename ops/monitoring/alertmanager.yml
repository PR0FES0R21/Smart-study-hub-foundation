global:
  resolve_timeout: 5m
route:
  receiver: local-ui
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: local-ui
# This default only shows alerts in the private Alertmanager UI.
# Configure a private receiver (email/webhook/etc.) before production.
