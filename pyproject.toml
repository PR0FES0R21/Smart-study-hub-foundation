[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-study-foundation"
version = "0.5.0"
description = "FastAPI/PostgreSQL foundation for Smart Study Hub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "redis>=5.2,<7", "celery[redis]>=5.5,<6",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
  "PyJWT[crypto]>=2.10,<3", "argon2-cffi>=23.1,<26", "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/studyhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires isolated PostgreSQL and Redis instances"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
